name: Record class

on:
  schedule:
    # 12:17 UTC = 5:47 PM IST (buffer before 6:00 PM IST Advance Java class)
    - cron: "17 12 * * *"
    # 13:47 UTC = 7:17 PM IST (buffer before 7:30 PM IST React JS class)
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      class_keyword:
        description: "Class to record ('auto', 'Advance Java', 'React JS', or 'all')"
        required: false
        default: "auto"
      class_start:
        description: "Class start time in IST (HH:MM, leave blank for auto/profile default)"
        required: false
        default: ""
      class_duration_min:
        description: "Recording duration in minutes (leave blank for profile default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: record-${{ github.event.schedule || inputs.class_keyword || 'default' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull pre-built image
        run: docker pull -q "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/naresh-zoom-recorder:latest"

      - name: Record class and upload to Telegram
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CLASS_KEYWORD: ${{ inputs.class_keyword || vars.CLASS_KEYWORD || 'auto' }}
          CLASS_START: ${{ inputs.class_start || vars.CLASS_START || '' }}
          CLASS_DURATION_MIN: ${{ inputs.class_duration_min || vars.CLASS_DURATION_MIN || '' }}
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --init --shm-size=2g \
            -v "$PWD/out:/out" \
            -e RECORD_PATH=/out/class_recording.mp4 \
            -e PORTAL_URL -e PORTAL_USER -e PORTAL_PASS \
            -e TG_API_ID -e TG_API_HASH -e TG_BOT_TOKEN -e TG_CHAT_ID \
            -e CLASS_KEYWORD -e CLASS_START -e CLASS_DURATION_MIN \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/naresh-zoom-recorder:latest"
