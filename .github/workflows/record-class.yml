name: Record class

on:
  schedule:
    # 13:52 UTC = 7:22 PM IST (8 minutes before the 7:30 PM class)
    - cron: "52 13 * * *"
  workflow_dispatch:
    inputs:
      class_keyword:
        description: "Class name on portal (e.g. React JS or Advance Java|Advanced Java)"
        required: false
        default: ""
      class_start:
        description: "Class start time in IST (HH:MM) - or 'now' for immediate test run"
        required: false
        default: ""
      class_end:
        description: "Class end time in IST (HH:MM) - hard stop"
        required: false
        default: ""
      class_duration_min:
        description: "Class duration in minutes"
        required: false
        default: ""
      manual_join_wait_sec:
        description: "Seconds to wait for manual human interaction if Zoom requires it (default: 600)"
        required: false
        default: "600"
      manual_mode:
        description: "Manual mode: YOU navigate the portal & join Zoom via Remote Desktop. No bot automation. (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: read

concurrency:
  group: record-${{ inputs.class_keyword || vars.CLASS_KEYWORD || 'default' }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull pre-built image
        run: docker pull -q "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/naresh-zoom-recorder:latest"

      - name: Record class, enable remote desktop & upload to Telegram
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CLASS_KEYWORD: ${{ inputs.class_keyword || vars.CLASS_KEYWORD || 'React JS' }}
          CLASS_START: ${{ inputs.class_start || vars.CLASS_START || '19:30' }}
          CLASS_END: ${{ inputs.class_end || vars.CLASS_END }}
          CLASS_DURATION_MIN: ${{ inputs.class_duration_min || vars.CLASS_DURATION_MIN || '90' }}
          USER_SELECTOR: ${{ vars.USER_SELECTOR || secrets.USER_SELECTOR }}
          PASS_SELECTOR: ${{ vars.PASS_SELECTOR || secrets.PASS_SELECTOR }}
          PARTICIPANT_NAME: ${{ vars.PARTICIPANT_NAME }}
          ZOOM_EMAIL: ${{ secrets.ZOOM_EMAIL }}
          ZOOM_PASS: ${{ secrets.ZOOM_PASS }}
          ZOOM_COOKIES: ${{ secrets.ZOOM_COOKIES }}
          MAX_WAIT_MIN: ${{ vars.MAX_WAIT_MIN }}
          MAX_MEETING_SEC: ${{ vars.MAX_MEETING_SEC }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          BLOCK_TRACKERS: ${{ vars.BLOCK_TRACKERS }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          VNC_PUBLIC_URL: ${{ vars.VNC_PUBLIC_URL }}
          MANUAL_JOIN_WAIT_SEC: ${{ inputs.manual_join_wait_sec || vars.MANUAL_JOIN_WAIT_SEC || '600' }}
          MANUAL_MODE: ${{ inputs.manual_mode || vars.MANUAL_MODE || 'false' }}
        run: |
          mkdir -p out && chmod 777 out
          touch out/step_summary.md && chmod 666 out/step_summary.md

          if [ -n "$ZOOM_COOKIES" ]; then
            printf "%s" "$ZOOM_COOKIES" > out/zoom_cookies.txt
            chmod 600 out/zoom_cookies.txt
          fi

          if [ -n "$VNC_PUBLIC_URL" ]; then
            echo "### 🖥️ Remote Desktop Access (noVNC)" >> out/step_summary.md
            echo "- **Live Browser Access:** [Open Remote Desktop]($VNC_PUBLIC_URL)" >> out/step_summary.md
            echo "- *Use your phone or laptop browser to watch or complete Zoom human verification.*" >> out/step_summary.md
            echo "" >> out/step_summary.md
          fi

          docker run --rm --init --shm-size=2g \
            -p 127.0.0.1:6080:6080 \
            -v "$PWD/out:/out" \
            -e RECORD_PATH=/out/class_recording.mp4 \
            -e STEP_SUMMARY_PATH=/out/step_summary.md \
            -e ZOOM_COOKIES_FILE=/out/zoom_cookies.txt \
            -e TZ=Asia/Kolkata \
            -e PORTAL_URL -e PORTAL_USER -e PORTAL_PASS \
            -e TG_API_ID -e TG_API_HASH -e TG_BOT_TOKEN -e TG_CHAT_ID \
            -e CLASS_KEYWORD -e CLASS_START -e CLASS_END -e CLASS_DURATION_MIN \
            -e USER_SELECTOR -e PASS_SELECTOR -e PARTICIPANT_NAME -e ZOOM_EMAIL -e ZOOM_PASS \
            -e ZOOM_COOKIES \
            -e MAX_WAIT_MIN -e MAX_MEETING_SEC -e ALLOWED_HOSTS -e BLOCK_TRACKERS \
            -e CF_TUNNEL_TOKEN -e VNC_PASSWORD -e VNC_PUBLIC_URL -e MANUAL_JOIN_WAIT_SEC -e MANUAL_MODE \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/naresh-zoom-recorder:latest"

      - name: Publish Step Summary to GitHub Job
        if: always()
        run: |
          if [ -f out/vnc_url.txt ]; then
            VNC_LINK=$(cat out/vnc_url.txt)
            echo "### 🖥️ Live Remote Desktop (noVNC)" >> "$GITHUB_STEP_SUMMARY"
            echo "- 🔗 **Web Remote Desktop:** [Open noVNC Screen]($VNC_LINK)" >> "$GITHUB_STEP_SUMMARY"
            echo "- *Interact with Chrome live on your mobile or laptop browser.*" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/step_summary.md ]; then
            cat out/step_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Recording MP4 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-recording
          path: out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Diagnostic Logs and Step Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-diagnostics
          path: |
            out/*.md
            out/*.txt
            out/*.log
            /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore
